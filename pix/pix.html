<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay on Monitor — Pix</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="pix.css">
</head>
<body>
  <main class="card">
    <header>
      <img src="../icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="pixTitle"></h1>
        <p class="muted" data-i18n="pixSubtitle"></p>
      </div>
    </header>

    <div class="amounts" id="amounts" role="radiogroup"></div>

    <label class="custom" id="customRow" hidden>
      <span>R$</span>
      <input id="custom" type="number" min="1" step="1" inputmode="decimal" placeholder="0">
    </label>

    <div class="qr" id="qr" aria-live="polite"></div>
    <p class="value" id="value"></p>
    <p class="muted center" data-i18n="pixScan"></p>

    <button id="copyCode" class="btn primary" data-i18n="pixCopyCode"></button>
    <button id="copyKey" class="btn ghost" data-i18n="pixCopyKey"></button>

    <p class="muted center small" data-i18n="pixThanks"></p>
  </main>

  <script src="../i18n.js"></script>
  <script src="../popup/config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="brcode.js"></script>
  <script src="pix.js"></script>
</body>
</html>
